<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solution.AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2337352f'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff; --side:#f7f7f5; --ink:#37352f; --muted:#787774; --faint:#9b9a97;
  --line:rgba(55,53,47,.12); --hover:rgba(55,53,47,.06); --hover2:rgba(55,53,47,.1);
  --accent:#2383e2; --red:#eb5757;
  --pop:0 0 0 1px rgba(15,15,15,.05), 0 3px 6px rgba(15,15,15,.1), 0 9px 24px rgba(15,15,15,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;text-align:left}
.app{display:flex;height:100vh;height:100dvh}

/* sidebar */
.sidebar{width:252px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;flex-shrink:0;transition:transform .25s}
.ws{display:flex;align-items:center;gap:9px;padding:6px 8px 12px;font-weight:600;font-size:14.5px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.nav{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:6px;font-size:14px;color:var(--ink);width:100%;min-height:30px}
.nav:hover{background:var(--hover)}
.nav.active{background:var(--hover2);font-weight:500}
.nav svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.nav.hist-item{color:#55534e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:13.5px}
.side-title{font-size:12px;color:var(--faint);font-weight:500;padding:16px 10px 4px}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px}
.userbox{display:flex;align-items:center;gap:9px;padding:8px;border-radius:6px;cursor:pointer;margin-top:6px}
.userbox:hover{background:var(--hover)}
.uava{width:24px;height:24px;border-radius:50%;background:#e8c9a8;color:#5b3d1d;display:grid;place-items:center;font-size:12px;font-weight:700}
.userbox b{font-size:13.5px;font-weight:500;display:block;line-height:1.2}
.userbox span{font-size:12px;color:var(--muted)}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;flex-shrink:0}
.topbar .crumb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:30px;height:30px;border-radius:6px;display:none;place-items:center}
.icon-btn:hover{background:var(--hover)}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.active{display:flex}

/* face (assistant avatar) */
.face{border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;flex-shrink:0}
.face svg{width:62%;height:62%}

/* chat view */
#view-chat{position:relative}
.messages{flex:1;overflow:auto;padding:10px 24px 12px}
.msgwrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-bottom:10px}
.msg{display:flex;gap:12px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.msg.user{justify-content:flex-end}
.msg.user .body{background:var(--hover);padding:9px 14px;border-radius:14px;max-width:85%;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.ai .col{min-width:0;flex:1}
.msg.ai .who{font-size:12.5px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.msg.ai .body{font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.ai .body.err{color:#b4233a}
.msg .body pre{background:#f7f6f3;border:1px solid var(--line);color:#37352f;padding:12px 14px;border-radius:8px;overflow:auto;font-size:13px;margin:8px 0;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.msg .body code{background:rgba(135,131,120,.15);color:#eb5757;padding:1px 5px;border-radius:4px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.msg .body pre code{background:none;color:inherit;padding:0}
.msg .body .h{display:block;font-weight:650;font-size:1.05em;margin-top:6px}
.acts{display:flex;gap:2px;margin-top:6px}
.acts button{font-size:12.5px;color:var(--muted);padding:4px 8px;border-radius:6px}
.acts button:hover{background:var(--hover)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:4px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}

.hero{display:none;flex-direction:column;align-items:center;gap:14px;padding:0 24px;text-align:center}
.hero h1{font-size:30px;font-weight:650;letter-spacing:-.6px}
.cwrap{padding:6px 24px 20px;flex-shrink:0}
.cbox{position:relative;max-width:740px;margin:0 auto;width:100%}
.composer{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(15,15,15,.05),0 4px 14px rgba(15,15,15,.06);padding:12px 12px 10px 16px;transition:.2s}
.composer:focus-within{border-color:rgba(35,131,226,.55);box-shadow:0 0 0 3px rgba(35,131,226,.14),0 4px 14px rgba(15,15,15,.06)}
.composer textarea{width:100%;border:none;outline:none;resize:none;background:transparent;font-size:15.5px;min-height:28px;max-height:200px;line-height:1.5;display:block}
.composer textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.crow .l{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;font-size:13.5px;color:var(--muted);font-weight:500;transition:.15s}
.pill:hover{background:var(--hover);color:var(--ink)}
.pill.on{color:var(--accent);background:rgba(35,131,226,.09)}
.pill svg{width:16px;height:16px}
.pill.model{color:var(--ink)}
.pill .chev{width:12px;height:12px;opacity:.6}
.send{width:32px;height:32px;border-radius:50%;background:rgba(55,53,47,.18);color:#fff;display:grid;place-items:center;transition:.15s;flex-shrink:0}
.send.on{background:var(--accent)}
.send svg{width:16px;height:16px}
.suggest{display:none;max-width:740px;width:100%;margin:6px auto 0;padding:0 24px}
.suggest .lbl{font-size:12.5px;color:var(--faint);font-weight:500;padding:0 8px 6px}
.sug{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;color:#55534e}
.sug:hover{background:var(--hover)}
.sug svg{width:18px;height:18px;color:var(--faint);flex-shrink:0}
#view-chat.start{justify-content:center;padding-bottom:6vh}
#view-chat.start .messages{display:none}
#view-chat.start .hero,#view-chat.start .suggest{display:flex}
#view-chat.start .suggest{flex-direction:column}
#view-chat.start .cwrap{padding-top:22px}

/* popovers */
.pop{position:absolute;left:0;bottom:calc(100% + 8px);width:340px;max-width:calc(100vw - 32px);max-height:min(440px,56vh);overflow:auto;background:#fff;border-radius:10px;box-shadow:var(--pop);padding:6px;display:none;z-index:30}
.pop.open{display:block;animation:pop .15s ease}
#view-chat.start .pop{bottom:auto;top:calc(100% + 8px)}
.pop .grp{font-size:12px;color:var(--faint);font-weight:500;padding:8px 8px 4px;display:flex;align-items:center;gap:7px}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.mrow:hover{background:var(--hover)}
.mrow .t{font-size:14px;font-weight:500;line-height:1.25}
.mrow .d{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.3}
.mrow .grow{flex:1;min-width:0}
.mrow.locked{opacity:.5}
.mrow .chk{width:16px;height:16px;color:var(--accent);flex-shrink:0}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:rgba(55,53,47,.08);color:var(--muted);white-space:nowrap}
.tag.max{background:rgba(155,89,182,.14);color:#8e44ad}
.tag.ultra{background:#37352f;color:#fff}
.tag.api{background:rgba(35,131,226,.12);color:var(--accent)}
.sep{height:1px;background:var(--line);margin:5px 4px}

.av{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.av svg{width:60%;height:60%}
.av.sm{width:20px;height:20px;border-radius:6px}.av.xs{width:16px;height:16px;border-radius:5px}.av.lg{width:32px;height:32px;border-radius:8px}

/* plans */
.plans-scroll{overflow:auto;padding:40px 28px 60px;flex:1}
.plans-head{text-align:center;margin-bottom:34px}
.plans-head h1{font-size:34px;letter-spacing:-.8px;margin-bottom:8px}
.plans-head p{color:var(--muted);font-size:15px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:900px;margin:0 auto}
.plan{border:1px solid var(--line);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;position:relative;background:#fff;transition:.2s}
.plan:hover{box-shadow:0 6px 24px rgba(15,15,15,.08)}
.plan.pop2{border:2px solid var(--accent)}
.badge{position:absolute;top:-11px;left:20px;font-size:11px;font-weight:700;color:#fff;padding:3px 10px;border-radius:5px;background:var(--accent);letter-spacing:.04em}
.plan h3{font-size:17px}
.price{font-size:38px;font-weight:700;letter-spacing:-1.2px}
.price span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14px;flex:1}
.plan li{display:flex;gap:9px;line-height:1.4}
.plan li:before{content:"✓";color:var(--accent);font-weight:700}

.btn{padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{background:#1a6fc7}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.current{opacity:.55;cursor:default}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,15,15,.45);display:none;place-items:center;padding:20px}
.overlay.open{display:grid;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(880px,100%);height:min(640px,100%);border-radius:12px;display:flex;overflow:hidden;background:#fff;box-shadow:var(--pop);position:relative}
.m-nav{width:210px;background:var(--side);border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.m-nav h2{font-size:12px;color:var(--faint);font-weight:500;padding:4px 10px 8px}
.m-body{flex:1;overflow:auto;padding:28px 32px}
.m-body h3{font-size:20px;font-weight:650;letter-spacing:-.3px;margin-bottom:4px}
.m-body .sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.5;padding-bottom:14px;border-bottom:1px solid var(--line)}
.m-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);z-index:2;text-align:center}
.m-close:hover{background:var(--hover)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.field input,.field select,.field textarea{padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:rgba(242,241,238,.6);outline:none;font-size:14px;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(35,131,226,.14)}
.field textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;min-height:230px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.card .grow{flex:1;min-width:0}
.card .t{font-weight:500;font-size:14px}
.card .d{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.soon{opacity:.5}
.sw{position:relative;width:34px;height:20px;border-radius:999px;background:rgba(55,53,47,.2);transition:.2s;flex-shrink:0}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--accent)}.sw.on:after{left:16px}
.swatches{display:flex;gap:10px}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);transition:.15s}
.swatch.sel{box-shadow:0 0 0 2px var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.55;padding:10px 12px;border-radius:8px;background:rgba(35,131,226,.07);margin-bottom:16px}
.note.warn{background:rgba(235,87,87,.08)}
.repo-list{max-height:230px;overflow:auto;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;background:var(--ink);color:#fff;box-shadow:var(--pop)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--pop)}
  .sidebar.open{transform:none}
  .icon-btn{display:grid}
  .hero h1{font-size:25px}
  .modal{flex-direction:column}
  .m-nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .m-nav h2{display:none}.m-nav .nav{width:auto;white-space:nowrap}
  .m-body{padding:20px 18px}.two,.stat{grid-template-columns:1fr}
}
/* file cards */
.fc{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:#fff;white-space:normal}
.fc-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--side);border-bottom:1px solid var(--line);font-size:13px}
.fc-i{display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.fc-i svg{width:16px;height:16px}
.fc-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fc-s{color:var(--faint);font-size:12px;white-space:nowrap}
.fc-b{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.fc-b button{font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.fc-b button:hover{background:var(--hover)}
.fc-b button[data-a=dl]{background:var(--accent);color:#fff;border-color:transparent}
.fc-b button[data-a=dl]:hover{filter:brightness(.92)}
.fc pre{margin:0!important;border:none!important;border-radius:0!important;max-height:420px}
.msg .body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.msg .body pre.open{opacity:.85}
.msg.ai .col{overflow:hidden}
@media(max-width:760px){.fc-s{display:none}.fc-b button{padding:4px 8px}.sidebar:not(.open){box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="ws"><div class="logo">S</div>Solution.AI</div>
    <button class="nav active" data-view="chat" id="newChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>New AI chat</button>
    <button class="nav" data-view="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Check plans</button>
    <button class="nav" id="openSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    <div class="side-title">Chats</div>
    <div class="hist" id="hist"></div>
    <div class="userbox" id="userbox"><div class="uava" id="uAva">U</div><div><b id="uName">Guest</b><span id="planName">Free plan</span></div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="crumb" id="crumb">AI chat</span>
    </div>

    <section class="view active start" id="view-chat">
      <div class="messages" id="messages"><div class="msgwrap" id="msgwrap"></div></div>
      <div class="hero" id="hero"></div>
      <div class="cwrap">
        <div class="cbox">
          <div class="pop" id="pop"></div>
          <div class="composer">
            <textarea id="input" rows="1" placeholder="Ask, search, or make anything…"></textarea>
            <div class="crow">
              <div class="l">
                <button class="pill" id="plusBtn" title="Add context"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <button class="pill model" id="modelBtn"></button>
                <button class="pill" id="brainBtn" title="Use the Brain file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0-3 3v.2A3 3 0 0 0 4 10a3 3 0 0 0 1 2.2A3.2 3.2 0 0 0 6 17a3 3 0 0 0 3 3 2 2 0 0 0 3-1.7V5.7A2 2 0 0 0 9 4zM15 4a3 3 0 0 1 3 3v.2a3 3 0 0 1 2 2.8 3 3 0 0 1-1 2.2 3.2 3.2 0 0 1-1 4.8 3 3 0 0 1-3 3 2 2 0 0 1-3-1.7V5.7A2 2 0 0 1 15 4z"/></svg>Brain</button>
                <button class="pill on" id="repoChip" style="display:none"></button>
              </div>
              <button class="send" id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <div class="suggest" id="suggest"></div>

## Identity
You are Solution, the built-in AI agent of Solution.AI, a service that gives one place to chat with the newest AI models (Anthropic, SpaceX/Grok, Gemini, ChatGPT) and with models the user connects with their own API key (ApiModels).
- Your name is Solution. If asked who made the service, say it is Solution.AI.
- You are an AI, never claim to be human. You do not know which underlying model is answering unless the app tells you.
- You can use this Brain file as background knowledge. It is general and static, so it may be incomplete or outdated.

## Core principles
- Be helpful first: answer the actual question, then add short useful context.
- Be honest: if you do not know, say so. Never invent facts, sources, quotes, links or numbers.
- Be concise by default. Use more detail only when the question is complex or the user asks.
- Reply in the same language the user writes in, unless they ask for another.
- Treat the user as a capable adult. Do not lecture. Do not moralize.
- Ask one short clarifying question only when a wrong guess would waste real effort. Otherwise make a sensible assumption and say it.
- Prefer concrete examples over abstract explanations.

## Response style
- Start with the answer. No filler like "Great question".
- Use short paragraphs. Use lists only for steps, options or comparisons.
- Put code in fenced code blocks with the language name.
- For math, show the key steps and the final result clearly.
- For advice, give a recommendation and the main reason, then mention the main trade-off.
- When summarizing, keep meaning, drop detail, never add new claims.

## Reasoning method
1. Restate the goal in your head. 2. Identify what is known and unknown. 3. Break the task into small steps. 4. Solve step by step. 5. Check the result against the original question. 6. Give the answer plainly.
- For estimates, state assumptions and give a range.
- For comparisons, use the same criteria for every option.
- For debugging, reproduce the problem, isolate the cause, fix the smallest thing, then verify.

## Safety and limits
- Do not help with weapons capable of mass harm, malware, fraud, stalking, or sexual content involving minors.
- For medical, legal and financial questions give general information, mention that it is not professional advice, and suggest a qualified professional for serious cases.
- If someone seems in danger or in crisis, respond with care and encourage contacting local emergency services or a trusted person.
- Respect privacy. Do not try to identify private individuals. Never ask for passwords or API keys.
- Never reveal or repeat API keys the user has stored in the app.

This Brain is static. It does not contain news, prices, sports results, weather or anything that changes. For those, tell the user you may be out of date and suggest checking a live source. Facts about people in office, companies and products change often. Treat them as possibly outdated.

const MIME={html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',md:'text/markdown',txt:'text/plain',csv:'text/csv',xml:'application/xml',svg:'image/svg+xml',py:'text/x-python',ts:'text/typescript',yml:'text/yaml',yaml:'text/yaml',sh:'text/x-sh'};
const LANG_EXT={javascript:'js',js:'js',jsx:'jsx',typescript:'ts',ts:'ts',tsx:'tsx',python:'py',py:'py',html:'html',css:'css',json:'json',markdown:'md',md:'md',bash:'sh',shell:'sh',sh:'sh',zsh:'sh',csv:'csv',xml:'xml',svg:'svg',yaml:'yml',yml:'yml',sql:'sql',java:'java',c:'c',cpp:'cpp','c++':'cpp',csharp:'cs',cs:'cs',go:'go',rust:'rs',rs:'rs',php:'php',ruby:'rb',rb:'rb',kotlin:'kt',swift:'swift',lua:'lua',text:'txt',txt:'txt',plaintext:'txt',toml:'toml',ini:'ini',diff:'diff'};
const extOf=n=>(n.split('.').pop()||'').toLowerCase();
function parseFence(info,code,n){
  info=(info||'').trim();let lang='',name='';
  const m=info.match(/(?:file(?:name)?|title|name|path)\s*[:=]\s*"?([^\s"]+)"?/i);
  if(m)name=m[1];
  const first=info.split(/\s+/)[0]||'';
  if(first&&!/[:=]/.test(first)){
    if(/^[\w.\-\/]+\.\w{1,8}$/.test(first)&&!LANG_EXT[first.toLowerCase()]){name=name||first;lang=extOf(first)}
    else lang=first.toLowerCase();
  }
  if(!name){const c=code.slice(0,200).split('\n',1)[0].match(/^\s*(?:\/\/|#|<!--|\/\*|--)\s*file(?:name)?\s*[:=]\s*([\w.\/\-]+\.\w{1,8})/i);if(c)name=c[1]}
  name=name.replace(/^.*[\\\/]/,'').replace(/[^\w.\- ]/g,'_').slice(0,80);
  if(!name)name='snippet-'+n+'.'+(LANG_EXT[lang]||'txt');
  return{lang,name};
}
const fmtSize=b=>b<1024?b+' B':(b/1024).toFixed(b<10240?1:0)+' KB';
function codeCard(f,code,key,id){
  const sz=fmtSize(new Blob([code]).size);
  return `<div class="fc"><div class="fc-h"><span class="fc-i">${FILE_SVG}</span><span class="fc-n">${esc(f.name)}</span><span class="fc-s">${sz}</span><span class="fc-b"><button data-a="copy" data-k="${key}" data-i="${id}">Copy</button><button data-a="dl" data-k="${key}" data-i="${id}">Download</button></span></div><pre><code>${esc(code)}</code></pre></div>`;
}
function inline(s){
  return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/^#{1,6}\s+(.*)$/gm,'<span class="h">$1</span>').replace(/^- /gm,'• ');
}
/* handles half-streamed text: an unclosed fence is shown as a plain growing block */
function md(t,key){
  t=String(t);const files=[];let out='',i=0,n=0;
  while(i<t.length){
    const s=t.indexOf('```',i);
    if(s<0){out+=inline(esc(n?t.slice(i).replace(/^\n+/,''):t.slice(i)));break}
    const seg=t.slice(i,s).replace(/\n+$/,'');
    out+=inline(esc(n?seg.replace(/^\n+/,''):seg));
    const nl=t.indexOf('\n',s+3);
    if(nl<0)break;
    const info=t.slice(s+3,nl),e=t.indexOf('```',nl+1);
    if(e<0){out+=`<pre class="open"><code>${esc(t.slice(nl+1))}</code></pre>`;break}
    const code=t.slice(nl+1,e).replace(/\n$/,'');
    n++;const f=parseFence(info,code,n);
    out+=codeCard(f,code,key,files.length);files.push({name:f.name,text:code});
    i=e+3;while(t[i]==='\n')i++;
  }
  if(key!==undefined)FILES.set(key,files);
  return out;
}

/* ---------- downloads ---------- */
function saveBlob(blob,name){

function copyText(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'Copied':'Copy failed')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copied'),fb);else fb();
}
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=-1;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0}
function makeZip(files){ /* store-only ZIP, no libraries */
  const enc=new TextEncoder(),parts=[],cen=[],used=new Set();let off=0;
  const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    let name=f.name;
    if(used.has(name)){const m=name.match(/^(.*?)(\.[^.]*)?$/);let i=2;while(used.has(m[1]+'-'+i+(m[2]||'')))i++;name=m[1]+'-'+i+(m[2]||'')}
    used.add(name);
    const nb=enc.encode(name),data=enc.encode(f.text),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    parts.push(lh.buffer,nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nb);off+=30+nb.length+data.length;
  });
  const cs=cen.reduce((a,b)=>a+b.byteLength,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}

const RC={repo:'',text:''};
async function repoContext(){

    return RC.text;
  }catch(e){return ''}

async function readStream(res,pick,onDelta){
  if(!res.ok){let d={};try{d=await res.json()}catch(e){}throw new Error((d.error&&d.error.message)||res.statusText||('HTTP '+res.status))}
  if(!res.body)throw new Error('Streaming is not supported by this browser');
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',full='';
  for(;;){
    const{done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).replace(/\r$/,'');buf=buf.slice(i+1);
      if(line.slice(0,5)!=='data:')continue;
      const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
      let j;try{j=JSON.parse(d)}catch(e){continue}
      const t=pick(j);if(t){full+=t;onDelta(full)}
    }
  }
  return full;
}
async function callApi(m,history,system,opt){
  opt=opt||{};
  const base=(m.base||API_TYPES[m.type].base).replace(/\/+$/,''),signal=opt.signal,stream=!!opt.onDelta&&m.type!=='gemini';
  let res,data;
  if(m.type==='anthropic'){
    res=await fetch(base+'/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':m.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m.modelId,max_tokens:8192,stream,system:system||undefined,messages:history})});
    if(stream)return readStream(res,j=>{if(j.type==='error')throw new Error((j.error&&j.error.message)||'Stream error');return j.type==='content_block_delta'&&j.delta&&j.delta.text},opt.onDelta);
    data=await res.json();if(!res.ok)throw new Error(data.error?.message||res.statusText);
    return(data.content||[]).map(c=>c.text||'').join('');
  }
  if(m.type==='gemini'){
    res=await fetch(`${base}/models/${encodeURIComponent(m.modelId)}:generateContent?key=${encodeURIComponent(m.key)}`,{method:'POST',signal,headers:{'content-type':'application/json'},body:JSON.stringify({contents:history.map(h=>({role:h.role==='assistant'?'model':'user',parts:[{text:h.content}]})),systemInstruction:system?{parts:[{text:system}]}:undefined})});
    data=await res.json();if(!res.ok)throw new Error(data.error?.message||res.statusText);
    return(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'(empty response)';
  }
  const msgs=(system?[{role:'system',content:system}]:[]).concat(history);
  res=await fetch(base+'/chat/completions',{method:'POST',signal,headers:{'content-type':'application/json',Authorization:'Bearer '+m.key},body:JSON.stringify({model:m.modelId,messages:msgs,stream})});
  if(stream)return readStream(res,j=>{if(j.error)throw new Error(j.error.message||'Stream error');return j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content},opt.onDelta);
  data=await res.json();if(!res.ok)throw new Error(data.error?.message||res.statusText);
  return data.choices?.[0]?.message?.content||'(empty response)';
}

async function send(){
  if(ctl)return;

  $('input').value='';$('input').style.height='auto';
  if(!S.cur){S.cur={id:Date.now(),title:text.slice(0,40),msgs:[]};S.chats.push(S.cur)}
  setStart(false);$('crumb').textContent=S.cur.title;
  const history=S.cur.msgs.filter(m=>!m.err).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
  history.push({role:'user',content:text});
  S.cur.msgs.push({role:'user',text});addMsg('user',text);
  let t;
  if(S.sel.provider==='auto')t=pickAuto(text);
  else if(S.sel.provider==='api'){const m=S.api.find(x=>x.id===S.sel.model);t={kind:'api',m,name:m.name,av:[API_TYPES[m.type].color,'key']}}
  else{const p=curProvider();t={kind:'demo',name:S.sel.model,av:[p.color,p.icon]}}
  const label=S.sel.provider==='auto'?'Auto → '+t.name:t.name;
  const el=addMsg('ai','',t.av,label),b=el.querySelector('.body'),key=el.dataset.k,box=$('messages');
  b.innerHTML=TYPING;
  ctl=new AbortController();setBusy(true);
  let reply='',err=false,latest='',raf=0;
  const paint=()=>{raf=0;const near=box.scrollHeight-box.scrollTop-box.clientHeight<160;b.innerHTML=md(latest,key);if(near)box.scrollTop=box.scrollHeight};
  try{
    if(t.kind==='api'){
      const sys=[FILE_RULES,brainSystem(),await repoContext()].filter(Boolean).join('\n\n');
      reply=await callApi(t.m,trimHist(history),sys,{signal:ctl.signal,onDelta:x=>{latest=x;if(!raf)raf=requestAnimationFrame(paint)}});
    }else{
      await new Promise(r=>setTimeout(r,350));
      const fromBrain=S.brainOn?brainAnswer(text):null;
      reply=fromBrain||`This is a demo reply from ${t.name}. Built-in models need your backend.\n\nFor real answers right now, open **Settings → API Models** and add your own key. ${S.brainOn?'Ask about geography, space, science, history, math or coding to see the Brain answer offline.':'Turn the Brain on to get offline answers from the knowledge file.'}`;
    }
  }catch(e){
    if(e.name==='AbortError'){reply=(latest?latest+'\n\n':'')+'(stopped)'}
    else{err=true;reply=(latest?latest+'\n\n':'')+'Request failed: '+e.message+'\n\nCheck the key, model ID and base URL in Settings → API Models.'}
  }
  if(raf)cancelAnimationFrame(raf);
  ctl=null;setBusy(false);
  b.innerHTML=md(reply,key);b.classList.toggle('err',err);
  if(!err)addActs(el,reply);
  S.cur.msgs.push({role:'ai',text:reply,av:t.av,name:label,err});saveChats();renderHist();
  box.scrollTop=box.scrollHeight;
}
function updateSend(){$('send').classList.toggle('on',!!ctl||!!$('input').value.trim())}
$('send').onclick=()=>{if(ctl)ctl.abort();else send()};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
let sizeRaf=0;
$('input').addEventListener('input',()=>{
  if(!sizeRaf)sizeRaf=requestAnimationFrame(()=>{sizeRaf=0;const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px'});
  updateSend();
});

  else c.style.display='none';

$('repoChip').onclick=()=>{S.repo=null;RC.repo='';LS.set('up_repo',null);renderRepoChip();toast('Repository detached')};

/* ================= PLANS ================= */
function renderPlans(){

/* ================= SETTINGS ================= */
const TABS=[['general','General'],['brain','Brain'],['api','API Models'],['integrations','Integrations'],['data','Data & privacy']];
let curTab='general',editId=null;
function openSettings(tab){curTab=tab||curTab;editId=null;$('overlay').classList.add('open');renderSettings()}
function closeSettings(){if(!$('overlay').classList.contains('open'))return;$('overlay').classList.remove('open');renderBtn();if(!S.cur)renderHero()}
$('openSettings').onclick=()=>{$('sidebar').classList.remove('open');openSettings('general')};
$('userbox').onclick=()=>{$('sidebar').classList.remove('open');openSettings('general')};
$('mClose').onclick=closeSettings;
$('overlay').addEventListener('mousedown',e=>{if(e.target===$('overlay'))closeSettings()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSettings();closePop()}});
function renderSettings(){
  $('mNav').innerHTML='<h2>Settings</h2>'+TABS.map(t=>`<button class="nav ${t[0]===curTab?'active':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('mNav').querySelectorAll('.nav').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;editId=null;renderSettings()});
  const body=$('mBody');body.scrollTop=0;({general:tabGeneral,brain:tabBrain,api:tabApi,integrations:tabInteg,data:tabData})[curTab](body);
}
function tabGeneral(b){
  b.innerHTML=`<h3>General</h3><div class="sub">Personalize Solution.AI.</div>
  <div class="field"><label>Display name</label><input id="fName" value="${esc(S.name)}" placeholder="Your name"></div>
  <div class="field"><label>Accent color</label><div class="swatches">${THEMES.map((t,i)=>`<div class="swatch ${i===S.theme?'sel':''}" data-i="${i}" style="background:${t}"></div>`).join('')}</div></div>
  <div class="card"><div class="grow"><div class="t">Current plan: ${planLabel()}</div><div class="d">Manage your subscription</div></div><button class="btn sm" id="goPlans">Check plans</button></div>`;
  $('fName').oninput=e=>{S.name=e.target.value;LS.set('up_name',S.name);renderUser()};
  b.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{S.theme=+s.dataset.i;LS.set('up_theme',S.theme);applyTheme();tabGeneral(b)});
  $('goPlans').onclick=()=>{closeSettings();show('plans')};
}
function tabBrain(b){
  const txt=brainText(),secs=brainSections().length;
  b.innerHTML=`<h3>Brain</h3><div class="sub">The agent's knowledge file: identity, rules and general knowledge about the world. It is sent as a system prompt to your ApiModels and used for offline answers from built-in models.</div>
  <div class="card"><div class="grow"><div class="t">Use Brain</div><div class="d">Turn the knowledge file on or off for all chats</div></div><button class="sw ${S.brainOn?'on':''}" id="bOn"></button></div>
  <div class="stat" style="margin-top:14px"><div><b>${secs}</b><span>sections</span></div><div><b>${(txt.length/1024).toFixed(1)} KB</b><span>≈ ${Math.round(txt.length/4)} tokens per message</span></div><div><b style="font-size:13.5px;line-height:1.5">${esc(brainSource())}</b><span>source</span></div></div>
  <div class="actions" style="margin:0 0 14px"><button class="btn sm" id="bDown">Download brain.md</button><button class="btn sm" id="bUp">Upload brain file</button><button class="btn sm danger" id="bReset">Reset to default</button></div>
  <div class="field"><label>Edit Brain (Markdown, each “## Heading” is a section)</label><textarea id="bText" spellcheck="false">${esc(txt)}</textarea></div>
  <div class="actions"><button class="btn primary" id="bSave">Save changes</button></div>
  <div class="note" style="margin-top:16px">Keep <code>brain.md</code> in the same folder as the site: when the site is hosted, it loads automatically. Your edits and uploads are stored only in this browser.</div>`;
  $('bOn').onclick=()=>{S.brainOn=!S.brainOn;LS.set('up_brainOn',S.brainOn);renderBtn();tabBrain(b)};
  $('bDown').onclick=downloadBrain;$('bUp').onclick=()=>$('brainFile').click();
  $('bReset').onclick=()=>{S.brainCustom=null;LS.set('up_brain',null);toast('Brain reset');tabBrain(b)};
  $('bSave').onclick=()=>{const v=$('bText').value.trim();if(!v){toast('Brain cannot be empty');return}S.brainCustom=v;LS.set('up_brain',v);toast('Brain saved');tabBrain(b)};
}
function tabApi(b){
  if(editId!==null)return apiForm(b);
  b.innerHTML=`<h3>API Models</h3><div class="sub">Connect your own API key. The model appears under <b>ApiModels</b> in the model picker and can be included in <b>Auto</b>.</div>
  <div class="note warn">Keys are stored only in this browser (localStorage) and sent directly to the provider you choose, never to Solution.AI servers. Anyone with access to this browser profile can read them. Don't use this on shared computers.</div>
  ${S.api.length?S.api.map(m=>`<div class="card">${avRaw(API_TYPES[m.type].color,'key','lg')}<div class="grow"><div class="t">${esc(m.name)}</div><div class="d">${esc(m.modelId)} · ${esc(API_TYPES[m.type].label.split(' (')[0])} · key •••• ${esc(m.key.slice(-4))}</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><button class="sw ${m.auto?'on':''}" data-auto="${m.id}" title="Include in Auto"></button><span style="font-size:10.5px;color:var(--muted)">Auto</span></div>
    <button class="btn sm" data-edit="${m.id}">Edit</button><button class="btn sm danger" data-del="${m.id}">Remove</button></div>`).join(''):'<div class="sub" style="border:none;margin:0">No API models yet.</div>'}
  <div class="actions"><button class="btn primary" id="addApi">+ Add API model</button></div>`;
  $('addApi').onclick=()=>{editId='new';renderSettings()};
  b.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{editId=x.dataset.edit;renderSettings()});
  b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{
    S.api=S.api.filter(m=>m.id!==x.dataset.del);LS.set('up_apimodels',S.api);
    if(S.sel.provider==='api'&&S.sel.model===x.dataset.del){S.sel={provider:'auto',model:'Auto'};LS.set('up_sel',S.sel)}
    toast('Model removed');renderSettings();
  });
  b.querySelectorAll('[data-auto]').forEach(x=>x.onclick=()=>{const m=S.api.find(y=>y.id===x.dataset.auto);m.auto=!m.auto;LS.set('up_apimodels',S.api);renderSettings()});
}
function apiForm(b){
  const m=editId==='new'?{type:'openai',name:'',modelId:'',key:'',base:'',auto:true}:S.api.find(x=>x.id===editId);
  b.innerHTML=`<h3>${editId==='new'?'Add API model':'Edit API model'}</h3><div class="sub">Works directly from your browser with your own key.</div>
  <div class="field"><label>Provider type</label><select id="aType">${Object.entries(API_TYPES).map(([k,v])=>`<option value="${k}" ${m.type===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label>Display name</label><input id="aName" value="${esc(m.name)}" placeholder="My GPT"></div>
  <div class="field"><label>Model ID</label><input id="aModel" value="${esc(m.modelId)}" placeholder="gpt-5.5 / claude-sonnet-5-5 / gemini-3-pro"></div></div>
  <div class="field"><label>API key</label><input id="aKey" type="password" value="${esc(m.key)}" placeholder="sk-…" autocomplete="off"></div>
  <div class="field"><label>Base URL (optional)</label><input id="aBase" value="${esc(m.base||'')}" placeholder="${API_TYPES[m.type].base}"></div>
  <div class="card"><div class="grow"><div class="t">Include in Auto</div><div class="d">Auto will route messages to this model</div></div><button class="sw ${m.auto?'on':''}" id="aAuto"></button></div>
  <div class="actions"><button class="btn primary" id="aSave">Save</button><button class="btn" id="aTest">Test connection</button><button class="btn" id="aCancel">Cancel</button></div>`;
  let auto=m.auto;
  $('aAuto').onclick=()=>{auto=!auto;$('aAuto').classList.toggle('on',auto)};
  $('aType').onchange=()=>{$('aBase').placeholder=API_TYPES[$('aType').value].base};
  const read=()=>({id:m.id||('m'+Date.now()),type:$('aType').value,name:$('aName').value.trim(),modelId:$('aModel').value.trim(),key:$('aKey').value.trim(),base:$('aBase').value.trim(),auto});
  $('aSave').onclick=()=>{
    const v=read();if(!v.name||!v.modelId||!v.key){toast('Fill name, model ID and API key');return}
    if(editId==='new')S.api.push(v);else S.api=S.api.map(x=>x.id===v.id?v:x);
    LS.set('up_apimodels',S.api);editId=null;toast('Saved — see ApiModels in the model picker');renderSettings();
  };
  $('aTest').onclick=async()=>{
    const v=read();if(!v.modelId||!v.key){toast('Enter model ID and API key first');return}
    $('aTest').textContent='Testing…';
    try{await callApi(v,[{role:'user',content:'Reply with the single word: ok'}]);toast('Connection works')}catch(e){toast('Failed: '+e.message)}
    $('aTest').textContent='Test connection';
  };
  $('aCancel').onclick=()=>{editId=null;renderSettings()};
}
let ghRepos=null;
function tabInteg(b){
  const connected=!!S.gh;
  b.innerHTML=`<h3>Integrations</h3><div class="sub">Connect your tools. Tokens are stored only in this browser.</div>
  <div class="card">${avRaw(['#334155','#0f172a'],'git','lg')}<div class="grow"><div class="t">GitHub</div><div class="d">${connected?'Connected as '+esc(S.gh.user.login):'Attach repositories to your chats'}</div></div>${connected?'<button class="btn sm danger" id="ghOff">Disconnect</button>':''}</div>
  ${connected?`<div class="repo-list" id="repoList"><div class="sub" style="border:none">Loading…</div></div><div class="note" style="margin-top:12px">An attached repository's README is sent as context to your <b>ApiModels</b> with each message.</div>`
  :`<div class="note" style="margin-top:14px">Create a <b>Personal access token</b> on GitHub (Settings → Developer settings → Tokens) with <code>repo</code> read access and paste it here.</div>
  <div class="field"><label>Personal access token</label><input id="ghTok" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off"></div>
  <button class="btn primary" id="ghOn">Connect GitHub</button>`}
  <div style="margin-top:20px"></div>
  ${['Google Drive','Notion','Slack'].map(n=>`<div class="card soon"><div class="av lg" style="background:rgba(55,53,47,.15);color:var(--ink);font-weight:700">${n[0]}</div><div class="grow"><div class="t">${n}</div><div class="d">Coming soon</div></div><span class="tag">Soon</span></div>`).join('')}`;
  if(connected){
    $('ghOff').onclick=()=>{S.gh=null;S.repo=null;ghRepos=null;LS.set('up_gh',null);LS.set('up_repo',null);renderRepoChip();toast('GitHub disconnected');renderSettings()};
    loadRepos();
  }else{
    $('ghOn').onclick=async()=>{
      const token=$('ghTok').value.trim();if(!token){toast('Paste your token first');return}
      $('ghOn').textContent='Connecting…';
      try{
        const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+token}});
        if(!r.ok)throw new Error(r.status===401?'Invalid token':'GitHub error '+r.status);
        const u=await r.json();S.gh={token,user:{login:u.login,avatar:u.avatar_url}};LS.set('up_gh',S.gh);toast('Connected as '+u.login);renderSettings();
      }catch(e){toast(e.message);$('ghOn').textContent='Connect GitHub'}
    };
  }
}
async function loadRepos(){
  const box=$('repoList');if(!box)return;
  try{
    if(!ghRepos){const r=await fetch('https://api.github.com/user/repos?sort=updated&per_page=40',{headers:{Authorization:'Bearer '+S.gh.token}});if(!r.ok)throw new Error('GitHub error '+r.status);ghRepos=await r.json()}
    if(!$('repoList'))return;
    box.innerHTML=ghRepos.length?ghRepos.map(r=>`<div class="card"><div class="grow"><div class="t">${esc(r.full_name)}</div><div class="d">${esc(r.description||'No description')}</div></div><button class="btn sm ${S.repo===r.full_name?'current':''}" data-repo="${esc(r.full_name)}">${S.repo===r.full_name?'Attached':'Attach'}</button></div>`).join(''):'<div class="sub" style="border:none">No repositories found.</div>';
    box.querySelectorAll('[data-repo]').forEach(x=>x.onclick=()=>{S.repo=x.dataset.repo;LS.set('up_repo',S.repo);renderRepoChip();toast('Attached '+S.repo);loadRepos()});
  }catch(e){if($('repoList'))$('repoList').innerHTML=`<div class="sub" style="border:none">Could not load repositories: ${esc(e.message)}</div>`}
}
function tabData(b){
  b.innerHTML=`<h3>Data & privacy</h3><div class="sub">Everything is stored locally in your browser.</div>
  <div class="card"><div class="grow"><div class="t">Chat history</div><div class="d">${S.chats.length} saved chats</div></div><button class="btn sm danger" id="clrChats">Clear chats</button></div>
  <div class="card"><div class="grow"><div class="t">API keys</div><div class="d">${S.api.length} ApiModels saved</div></div><button class="btn sm danger" id="clrKeys">Remove all keys</button></div>
  <div class="card"><div class="grow"><div class="t">Export data</div><div class="d">Download chats & settings (keys not included)</div></div><button class="btn sm" id="exp">Export</button></div>
  <div class="card"><div class="grow"><div class="t">Reset everything</div><div class="d">Clears all Solution.AI data in this browser</div></div><button class="btn sm danger" id="rst">Reset</button></div>`;
  $('clrChats').onclick=()=>{S.chats=[];S.cur=null;LS.set('up_chats',[]);renderHist();toast('Chats cleared');tabData(b)};
  $('clrKeys').onclick=()=>{S.api=[];LS.set('up_apimodels',[]);if(S.sel.provider==='api'){S.sel={provider:'auto',model:'Auto'};LS.set('up_sel',S.sel)}toast('Keys removed');tabData(b)};
  $('exp').onclick=()=>{const blob=new Blob([JSON.stringify({chats:S.chats,name:S.name,plan:S.plan,apiModels:S.api.map(m=>({...m,key:undefined}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='solution-ai-export.json';a.click()};
  $('rst').onclick=()=>{if(confirm('Delete all Solution.AI data in this browser?')){Object.keys(localStorage).filter(k=>k.startsWith('up_')).forEach(k=>localStorage.removeItem(k));location.reload()}};
}

</script>
